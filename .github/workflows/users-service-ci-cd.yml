name: CI/CD for Users Service

on:
  push:
    branches: [ "only-books" ]
    paths:
      - 'users-service/**'
      - '.github/workflows/users-service-ci-cd.yml'
  pull_request:
    branches: [ "only-books" ]
    paths:
      - 'users-service/**'

env:
  SERVICE_NAME: users-service
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-test:
    name: Build and Test Users Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./users-service

    steps:
      # 1) Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3) Build
      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      # 4) Tests
      - name: Run tests
        run: mvn -B test

      # 5) Build Docker image (local, для smoke-теста)
      - name: Build Docker image (test)
        run: |
          docker build -t ${{ env.SERVICE_NAME }}:test .

      # 6) Smoke‑test контейнера
      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 8089:8089 ${{ env.SERVICE_NAME }}:test
          sleep 30
          docker ps
          curl -f http://localhost:8089/actuator/health || exit 1
          docker stop test-container
          docker rm test-container

  push-to-dockerhub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/only-books'

    steps:
      # 1) Checkout (для контекста сборки)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Login в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3) Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4) Docker metadata (теги/лейблы)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # 5) Build & Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./users-service
          file: ./users-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: push-to-dockerhub
    if: always()
    steps:
      # Минимальный step, чтобы job был валидным, плюс читаемый summary
      - name: Publish summary
        run: |
          echo "### Users Service Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result of push-to-dockerhub: ${{ needs.push-to-dockerhub.result }}" >> "$GITHUB_STEP_SUMMARY"
