name: CI/CD for Users Service

on:
  push:
    branches: [ "only-books" ]
    paths:
      - 'users-service/**'
      - '.github/workflows/users-service-ci-cd.yml'
  pull_request:
    branches: [ "only-books" ]
    paths:
      - 'users-service/**'

env:
  SERVICE_NAME: users-service
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-test:
    name: Build and Test Users Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./users-service

    steps:
      # Шаг 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Шаг 3: Build application
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Шаг 4: Run tests
      - name: Run tests
        run: mvn test

      # Шаг 5: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ env.SERVICE_NAME }}:test .

      # Шаг 6: Test Docker image
      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 8089:8089 ${{ env.SERVICE_NAME }}:test
          sleep 30
          docker ps
          # Basic health check
          curl -f http://localhost:8089/actuator/health || exit 1
          docker stop test-container
          docker rm test-container

  push-to-dockerhub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/only-books'

    steps:
      # Шаг 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Шаг 3: Setup Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 4: Extract metadata
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Шаг 5: Build and push
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./users-service
          file: ./users-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: push-to-dockerhub
    if: always()