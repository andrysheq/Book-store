apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: bookstore
data:
  # users-service
  SERVER_PORT: "8089"
  SPRING_CACHE_TYPE: "none"
  MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
  LOG_LEVEL_SPRING: "INFO"
  LOG_LEVEL_CACHE: "TRACE"
  LOG_LEVEL_WEB: "INFO"
  LOG_LEVEL_ROOT: "INFO"
  LOG_LEVEL_LOGBOOK: "TRACE"

  # book-author-service
  BOOK_SERVER_PORT: "8088"
  DB_PORT: "5432"
  DB_DATABASE: "books"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
